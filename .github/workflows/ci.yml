name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Install with path-like core constraint
        run: |
          composer config repositories.core vcs https://github.com/Maijied/Reportkit-Core.git
          composer update --prefer-dist --no-progress --no-interaction || composer install --prefer-dist --no-progress --no-interaction || true
      - name: Syntax check
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l
